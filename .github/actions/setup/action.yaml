name: 🌱 Setup
description: Setup the project CI environment

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 9.14.4
        run_install: false

    - name: Install node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20
        cache: "pnpm"

    - name: Install deps
      shell: bash
      run: pnpm install --frozen-lockfile
