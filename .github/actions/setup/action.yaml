name: 🌱 Setup
description: Setup the project CI environment

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 9.14.4
        run_install: false

    - name: Install node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20
        cache: "pnpm"

    - name: Install deps
      shell: bash
      run: pnpm install --frozen-lockfile
